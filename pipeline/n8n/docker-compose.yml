services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: channel-factory-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=America/Los_Angeles
      - N8N_DEFAULT_LOCALE=en
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_PERSONALIZATION_ENABLED=false
      - NODE_FUNCTION_ALLOW_BUILTIN=fs,path
      - NODE_FUNCTION_ALLOW_EXTERNAL=*
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - N8N_RUNNERS_TASK_TIMEOUT=900
      - EXECUTIONS_TIMEOUT=900
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - HEYGEN_API_KEY=${HEYGEN_API_KEY}
      - HEYGEN_AVATAR_ID=${HEYGEN_AVATAR_ID}
      - HEYGEN_TALKING_PHOTO_ID=${HEYGEN_TALKING_PHOTO_ID}
      - HEYGEN_VOICE_ID=${HEYGEN_VOICE_ID}
    volumes:
      - n8n_data:/home/node/.n8n
      - ../../accounts:/data/accounts:ro
      - ./workflows:/data/workflows:ro

volumes:
  n8n_data:
